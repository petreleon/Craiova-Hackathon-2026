[workspace]
resolver = "2"
members = [
    "crates/aero-math-6dof",
    "crates/aero-vision-fog",
    "crates/aero-meteo-cyber",
    "crates/aero-ai-cuda",
    "crates/aero-cockpit-server",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["AERO-SHIELD LRCV Team — Craiova Hackathon V2.0"]
license = "MIT"

[workspace.dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
simba = "0.9"
statrs = "0.17"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
image = "0.25"
bytemuck = { version = "1.19", features = ["derive"] }
candle-core = "0.8"
candle-nn = "0.8"
safetensors = "0.4"
arc-swap = "1.7"
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
